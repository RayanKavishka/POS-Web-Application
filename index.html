<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Shop</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Changa+One:ital@0;1&family=Fjalla+One&family=Luckiest+Guy&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/5531b2be1b3e7c1a87c1fa1121781d15?family=Thunder+Black" rel="stylesheet" type="text/css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<main>
  <!-- Sign up Section -->
  <section id="signupSection" class="loginUi d-flex flex-column justify-content-center align-items-center vh-100 p-3">

    <div class="login bg-black p-5 rounded-5 container-fluid d-flex flex-column gap-3 justify-content-center align-items-center">

      <h1>Book Shop POS</h1>

      <div class="btn-group w-100 d-flex gap-4" role="group" aria-label="Basic mixed styles example">
        <button id="sign-upNavigateBtnInSignup" type="button" class="chooseSignUp btn btn-warning rounded-4">Sign up</button>
        <button id="log-inNavigateBtnInSignup" type="button" class="chooseLogIn btn rounded-4" style="border-color: #ffffff; color: #ffffff">Log in</button>
      </div>

      <div class="input-group mb-3 w-100">
        <span class="input-group-text rounded-start-5"><i class="bi bi-person"></i></span>
        <div class="form-floating">
          <input type="text" class="userName form-control rounded-end-5" id="userNameSignup" placeholder="Username">
          <label for="userNameSignup" class="fs-6 fs-md-5 fs-lg-3">User Name</label>
        </div>
      </div>

      <div class="input-group mb-3 w-100">
        <span class="input-group-text rounded-start-5"><i class="bi bi-lock"></i></span>
        <div class="form-floating">
          <input type="password" class="form-control rounded-end-5" id="passwordSignup" placeholder="Username">
          <label for="passwordSignup" class="fs-6 fs-md-5 fs-lg-3">Password</label>
        </div>
      </div>

      <div class="input-group mb-3 w-100">
        <span class="input-group-text rounded-start-5"><i class="bi bi-capslock"></i></span>
        <div class="form-floating">
          <input type="password" class="form-control rounded-end-5" id="confirmPassword" placeholder="Username">
          <label for="confirmPassword" class="fs-6 fs-md-5 fs-lg-3">Confirm Password</label>
        </div>
      </div>

      <div class="d-grid gap-3 w-100 col-12">
        <button id="signUpBtn" class="btn loginBtn rounded-4 text-white" type="button">Sign up</button>

        <div class="text-center d-flex justify-content-evenly align-items-center">
          <small>Do have an account ?</small>
          <button id="haveAccBtn" class="btn btn-warning rounded-4 w-50" type="button">Log in</button>
        </div>
      </div>


    </div>

  </section>

  <!-- Log In Section -->
  <section id="loginSection" class="loginUi d-flex justify-content-center align-items-center vh-100 p-3">

    <div class="login bg-black p-5 rounded-5 container-fluid d-flex flex-column gap-3 justify-content-center align-items-center">

      <h1>Book Shop POS</h1>

      <div class="btn-group w-100 d-flex gap-4" role="group" aria-label="Basic mixed styles example">
        <button id="sign-upNavigateBtnInLogin" type="button" class="chooseSignUp btn rounded-4" style="border-color: #ffffff; color: #ffffff">Sign up</button>
        <button id="log-inNavigateBtnInLogin" type="button" class="chooseLogIn btn btn-warning rounded-4">Log in</button>
      </div>

      <div class="input-group mb-3 w-100">
        <span class="input-group-text rounded-start-5"><i class="bi bi-person"></i></span>
        <div class="form-floating">
          <input type="text" class="form-control rounded-end-5" id="userNameLogin" placeholder="Username">
          <label for="userNameLogin" class="fs-6 fs-md-5 fs-lg-3">User Name</label>
        </div>
      </div>

      <div class="input-group mb-3 w-100">
        <span class="input-group-text rounded-start-5"><i class="bi bi-lock"></i></span>
        <div class="form-floating">
          <input type="password" class="form-control rounded-end-5" id="passwordLogin" placeholder="Username">
          <label for="passwordLogin" class="fs-6 fs-md-5 fs-lg-3">Password</label>
        </div>
      </div>

      <div class="d-grid gap-3 w-100 col-12">
        <button id="loginBtn" class="btn loginBtn rounded-4 text-white" type="button">Log in</button>

        <div class="text-center d-flex justify-content-evenly align-items-center">
          <small>Don't have an account ?</small>
          <button id="notHaveAccBtn" class="btn btn-warning rounded-4 w-50" type="button">Sign up</button>
        </div>
      </div>

    </div>

  </section>
</main>

<script src="assets/lib/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="module" src="controller/LoginController.js"></script>
</body>
</html>

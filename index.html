<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Shop</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="styles/style.css">

</head>
<body>

<!-- Header -->
<header id="header" class="d-flex justify-content-center align-items-center">
  <nav id="navbar" class="navbar navbar-expand-lg navbar-dark bg-black position-fixed top-0 rounded-4 border border-secondary">
    <div class="container-fluid">
      <h4 class="navbar-brand">BSMS POS</h4>
      <button type="button" class="btn btn-danger rounded-4 logout">Log out</button>
    </div>
  </nav>
</header>

<main>
  <!-- Side Bar  -->
  <aside id="sidebar" class="position-fixed bottom-0 bg-black rounded-4 d-flex justify-content-center align-items-start text-center border border-secondary">
    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
      <li class="nav-item mt-5">
        <button type="button" class="btn rounded-4 text-white">Dashboard</button>
      </li>
      <li class="nav-item mt-5">
        <button type="button" class="btn rounded-4 text-white">Place Order</button>
      </li>
      <li class="nav-item mt-5">
        <button type="button" class="btn rounded-4 text-white">Customers</button>
      </li>
      <li class="nav-item mt-5">
        <button type="button" class="btn rounded-4 text-white">Items</button>
      </li>
      <li class="nav-item mt-5">
        <button type="button" class="btn rounded-4 text-white">Order History</button>
      </li>
    </ul>
  </aside>

  <!-- Customer Section -->
  <section id="customerSection" class="content mt-15">

    <div class="container-fluid text-center gy-3">
      <div class="row">

        <!-- Form -->
        <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-9 col-xxl-9 bg-black custom-box rounded-4">
          <form class="w-100">
            <div class="mb-3 d-flex gap-3">
              <label for="customerIdField" class="form-label">ID</label>
              <input type="number" class="form-control bg-dark text-white border-secondary" id="customerIdField">
            </div>
            <div class="mb-3 d-flex gap-3">
              <label for="customerNameField" class="form-label">Name</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="customerNameField">
            </div>
            <div class="mb-3 d-flex gap-3">
              <label for="customerMobileField" class="form-label">Mobile</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="customerMobileField">
            </div>
            <div class="mb-3 d-flex gap-3">
              <label for="customerAddressField" class="form-label">Address</label>
              <textarea class="form-control bg-dark text-white border-secondary" id="customerAddressField" style="height: 100px; resize: none"></textarea>
            </div>
          </form>
        </div>

        <!-- Buttons -->
        <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-3 col-xxl-3 d-flex flex-column gap-3 justify-content-center align-items-center rounded-4 p-15">
          <div class="d-flex flex-column gap-3">
            <div class="d-flex gap-3">
              <button class="btn bg-black square-btn rounded-4" style="width: 100px; height: 100px"
                      data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Save">
                <i class="bi bi-save text-success fs-1"></i>
              </button>

              <button class="btn bg-black square-btn rounded-4" style="width: 100px; height: 100px"
                      data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Update">
                <i class="bi bi-arrow-repeat text-warning fs-1"></i>
              </button>
            </div>

            <div class="d-flex gap-3">
              <button class="btn bg-black square-btn rounded-4" style="width: 100px; height: 100px"
                      data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Delete">
                <i class="bi bi-trash text-danger fs-1"></i>
              </button>

              <button class="btn bg-black square-btn rounded-4" style="width: 100px; height: 100px"
                      data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Reset">
                <i class="bi bi-x-circle text-light fs-1"></i>
              </button>
            </div>
          </div>

          <div class="d-flex bg-black p-3 rounded-4">
            <input class="form-control me-2 bg-dark text-white search" type="search" placeholder="Search Customer" aria-label="Search"/>
            <button class="btn btn-outline-success" type="submit">Search</button>
          </div>
        </div>

      </div>
    </div>

    <!-- Table -->
    <div class="bg-black p-3 mt-3 rounded-4">
      <table class="table table-dark text-white table-bordered border-secondary w-100 text-center">
        <thead class="custom-thead rounded-4">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Name</th>
          <th scope="col">Mobile</th>
          <th scope="col">Address</th>
        </tr>
        </thead>
        <tbody id="customerTBody rounded-4">

        </tbody>
      </table>
    </div>

  </section>

  <!-- Item Section -->
  <section id="ItemSection" class="content mt-15">

    <div class="container-fluid text-center">
      <div class="row">

        <!-- Form -->
        <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-9 col-xxl-9 bg-black custom-box rounded-4">
          <form class="w-100">
            <div class="mb-3 d-flex gap-3">
              <label for="itemIdField" class="form-label">ID</label>
              <input type="number" class="form-control bg-dark text-white border-secondary" id="itemIdField">
            </div>
            <div class="mb-3 d-flex gap-3">
              <label for="itemNameField" class="form-label">Name</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="itemNameField">
            </div>
            <div class="mb-3 d-flex gap-3">
              <label for="itemPriceField" class="form-label">Mobile</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="itemPriceField">
            </div>
            <div class="mb-3 d-flex gap-3">
              <label for="itemQtyField" class="form-label">Mobile</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="itemQtyField">
            </div>
          </form>
        </div>

        <!-- Buttons -->
        <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-3 col-xxl-3 d-flex flex-column gap-3 justify-content-center align-items-center rounded-4 p-15">
          <div class="d-flex flex-column gap-3">
            <div class="d-flex gap-3">
              <button class="btn bg-black square-btn rounded-4" style="width: 100px; height: 100px"
                      data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Save">
                <i class="bi bi-save text-success fs-1"></i>
              </button>

              <button class="btn bg-black square-btn rounded-4" style="width: 100px; height: 100px"
                      data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Update">
                <i class="bi bi-arrow-repeat text-warning fs-1"></i>
              </button>
            </div>

            <div class="d-flex gap-3">
              <button class="btn bg-black square-btn rounded-4" style="width: 100px; height: 100px"
                      data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Delete">
                <i class="bi bi-trash text-danger fs-1"></i>
              </button>

              <button class="btn bg-black square-btn rounded-4" style="width: 100px; height: 100px"
                      data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Reset">
                <i class="bi bi-x-circle text-light fs-1"></i>
              </button>
            </div>
          </div>

          <div class="d-flex bg-black p-3 rounded-4">
            <input class="form-control me-2 bg-dark text-white search" type="search" placeholder="Search Item" aria-label="Search"/>
            <button class="btn btn-outline-success" type="submit">Search</button>
          </div>

        </div>

      </div>
    </div>

    <!-- Table -->
    <div class="bg-black p-3 mt-3 rounded-4">
      <table class="table table-dark text-white table-bordered border-secondary w-100 text-center">
        <thead class="custom-thead rounded-4">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Name</th>
          <th scope="col">Mobile</th>
          <th scope="col">Address</th>
        </tr>
        </thead>
        <tbody id="itemTBody rounded-4">

        </tbody>
      </table>
    </div>

  </section>

  <!-- Order History Section -->
  <section id="OrderHistorySection" class="content mt-15">

    <div class="d-flex bg-black p-3 rounded-4">
      <input class="form-control me-2 bg-dark text-white search" type="search" placeholder="Search Order by Date" aria-label="Search"/>
      <button class="btn btn-outline-success" type="submit">Search</button>
    </div>

    <!-- Table -->
    <div class="bg-black p-3 mt-3 rounded-4">
      <table class="table table-dark text-white table-bordered border-secondary w-100 text-center">
        <thead class="custom-thead rounded-4">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Item</th>
          <th scope="col">Qty</th>
          <th scope="col">Unit Price</th>
          <th scope="col">Total</th>
          <th scope="col">Date</th>
        </tr>
        </thead>
        <tbody id="OrderHistoryTBody rounded-4">

        </tbody>
      </table>
    </div>

  </section>

</main>



<script src="assets/lib/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
  const tooltipList = [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));
</script>

</body>
</html>
